<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="header">
        <div class="logo">🎓</div>
        <div class="header-text">
            <h1>Student Records</h1>
            <p>Manage student information</p>
        </div>
    </div>

    <div id="alertBox" class="alert" style="display:none;">
        <span class="icon" id="alertIcon">✓</span>
        <span id="alertText"></span>
    </div>

    <div class="stats">
        <div class="stat"><div class="label">Total Students</div><div class="value" id="statTotal">0</div></div>
        <div class="stat"><div class="label">Active</div><div class="value green" id="statActive">0</div></div>
        <div class="stat"><div class="label">Archived</div><div class="value amber" id="statArchived">0</div></div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 id="formTitle">Add New Student</h2>
        </div>
        <div class="card-body">
            <form id="studentForm">
                <input type="hidden" id="editId" value="">
                <div class="form-grid">
                    <div class="field">
                        <label for="student_id">Student ID <span class="req">*</span></label>
                        <input type="text" id="student_id" placeholder="e.g. 2024-001" required maxlength="50">
                    </div>
                    <div class="field">
                        <label for="name">Full Name <span class="req">*</span></label>
                        <input type="text" id="name" placeholder="e.g. Maria Santos" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="program">Program <span class="req">*</span></label>
                        <input type="text" id="program" placeholder="e.g. BSIT" required maxlength="100">
                    </div>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save</button>
                </div>
                <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Student List</h2>
            <div class="filters">
                <a href="#" data-filter="all"      class="filter-tab active">All (<span id="cntAll">0</span>)</a>
                <a href="#" data-filter="active"   class="filter-tab">Active (<span id="cntActive">0</span>)</a>
                <a href="#" data-filter="archived" class="filter-tab">Archived (<span id="cntArchived">0</span>)</a>
            </div>
        </div>
        <div class="card-body" style="padding: 0;">
            <div id="emptyState" class="empty" style="display:none;">
                <div class="icon">📋</div>
                <div class="title">No records found</div>
                <div class="sub">Add your first student using the form above.</div>
            </div>
            <div class="table-wrap" id="tableWrap">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Program</th>
                            <th>Status</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="footer">
        Student Records System · <span id="year"></span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
